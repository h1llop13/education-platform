spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/education_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: "education-platform-super-secret-key-must-be-at-least-256-bits-long"
    expiration: 86400000 # 24 часа в миллисекундах

logging:
  level:
    org.springframework.security: DEBUG